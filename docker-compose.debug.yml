volumes:
      datasource:
      dataprotection-keys:
      redis-data:

networks:
       backend:

services:
    redis:
      image: redis:7-alpine
      container_name: Maroik.Redis
      restart: unless-stopped
      expose:
        - "6379"
      volumes:
        - redis-data:/data
      networks:
        - backend
      command: redis-server --appendonly yes
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5
      
    clamav:
      image: clamav/clamav:latest
      container_name: Maroik.Clamav
      expose:
        - "3310"
      networks:
        - backend
  
    postgresql:
      image: postgres:17
      container_name: Maroik.PostgreSQL
      env_file:
        - .env.debug
      volumes:
        - datasource:/var/lib/postgresql/data
        - ./Maroik.DB/PostgreSQL/SQL_Init_Script/Debugging:/docker-entrypoint-initdb.d
      expose:
        - "5432"
      networks:
        - backend

    maroik.website:
        build :
         context : .
         dockerfile : Maroik.Website/Dockerfile
        container_name: Maroik.Website
        networks :
          - backend
        ports:
          - "80:80"
          - "443:443"
        env_file:
          - .env.debug
        environment:
          - ASPNETCORE_Kestrel__Certificates__Default__Path=/etc/ssl/localhost1.pem
          - ASPNETCORE_Kestrel__Certificates__Default__KeyPath=/etc/ssl/localhostprivkey1.pem
        volumes:
          - ./Maroik.SSL/localhost1.pem:/etc/ssl/localhost1.pem:ro
          - ./Maroik.SSL/localhostprivkey1.pem:/etc/ssl/localhostprivkey1.pem:ro
          - ./Maroik.Log/:/app/Maroik.Log:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys
        depends_on:
          postgresql:
            condition: service_started
          redis:
            condition: service_healthy

    maroik.filestorage:
        build :
         context : .
         dockerfile : Maroik.FileStorage/Dockerfile
        container_name: Maroik.FileStorage
        networks :
          - backend
        expose:
          - "80"
        env_file:
          - .env.debug
        environment:
          - ASPNETCORE_URLS=http://+:80
        volumes:
          - ./Maroik.FileStorage/upload/:/app/upload:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys