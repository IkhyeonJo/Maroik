# when SSD space size is not enough, use blow command in cmd
# docker volume prune (or) docker volume ls (or) docker volume rm 
version: "3"

volumes:
      datasource:

networks:       
       backend:

services:

      mysql:
        image: "mysql:5.7.31"
        volumes:
          - datasource:/var/lib/mysql
          #blow command is not working... when you debugging, put data manually by using ./Site/_MySql_Init_Script/Init.sql
          #- ./_MySql_Init_Script:/docker-entrypoint-initdb.d 
        networks:
          - backend
        environment:
          - MYSQL_ROOT_PASSWORD=root
          - bind-address=0.0.0.0
        ports:
          - 3306:3306 
      
      mvc:
        image: ${DOCKER_REGISTRY-}site
        build :
         context : .
         dockerfile : Site/Dockerfile
        networks :
         - backend          
        ports:
         - 5000:80
         - 443:443
        environment :
         - DBHOST=mysql
         - ASPNETCORE_ENVIRONMENT=Development
         - ASPNETCORE_URLS=https://+:443;http://+:80
        depends_on :
         - mysql
          
