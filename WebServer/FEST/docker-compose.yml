version: '3.4' # File Form Version

services: # container lists
  festrubricwebserver: # WebService
    image: ${DOCKER_REGISTRY-}festrubricwebserver # image to Use
    build:
      context: .
      dockerfile: FestRubricWebServer/Dockerfile # just go Dockerfile
    depends_on: # build connection between container to container
      - db
  db: # dbService
    image: mysql # image to Use
    # restart: always
    container_name: mysql-test # set container name
    ports:
      - "3306:3306" # Set Container port [External Port:Internal Port]
    environment: # -e option
      - MYSQL_DATABASE=test
      - MYSQL_ROOT_PASSWORD=mariadb
      - TZ=Asia/Seoul
    command: # execute command
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      -  /Users/Shared/data/mysql-test:/var/lib/mysql # -v option (Set Directory mount)