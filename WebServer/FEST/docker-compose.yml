version: '3.4'

services:
  festrubricwebserver:
    image: ${DOCKER_REGISTRY-}festrubricwebserver
    build:
      context: .
      dockerfile: FestRubricWebServer/Dockerfile
    depends_on:
      - db
  db:
    image: mysql:8.0.0
    restart: always
    container_name: mysql-test
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=test
      - MYSQL_ROOT_PASSWORD=mariadb
      - TZ=Asia/Seoul
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci