### Tip: To see [CONTAINER ID], execute below this command
#docker ps

###Access docker container
#docker exec -it <containerID> /bin/bash

###In order to copy a file from a container to the host, you can use the command
#docker cp <containerId>:/file/path/within/container /host/path/target

###Backup and restore a mysql database from a running Docker mysql container

## Backup
#docker exec Maroik.MariaDB /usr/bin/mysqldump -u root --password=***REMOVED*** Maroik > backup.sql

## Restore
#cat backup.sql | docker exec -i Maroik.MariaDB /usr/bin/mysql -u root --password=***REMOVED*** Maroik
#----------------------------------------------------------------------------------------------------


#For Publish
version: "3"

volumes:
      datasource:

networks:       
       backend:

services:
    mariadb:
        image: "mariadb:10.11.2"
        container_name: Maroik.MariaDB
        volumes:
          - datasource:/var/lib/mysql
          - ./Maroik.MariaDB/SQL_Init_Script:/docker-entrypoint-initdb.d
        networks:
          - backend
        environment:
          - MYSQL_ROOT_PASSWORD=***REMOVED***
          - bind-address=0.0.0.0
          - TZ=Asia/Seoul
        command:
          - mysqld
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
          - --default-time-zone=+09:00

    maroik.website:
        build :
         context : .
         dockerfile : Maroik.WebSite/Dockerfile
        container_name: Maroik.WebSite
        networks :
          - backend          
        ports:
          - 80:80
          - 443:443
        environment :
          - DBHOST=mariadb
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_URLS=https://+:443;http://+:80
          - ASPNETCORE_Kestrel__Certificates__Default__Password=Passw0rd # must be equal to .pfx file's' password
          - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/testhttps.pfx
        volumes:
          - ./Maroik.WebSite/:/https:ro
        depends_on :
          - mariadb  

    maroik.webapi:
        build :
         context : .
         dockerfile : Maroik.WebAPI/Dockerfile
        container_name: Maroik.WebAPI
        networks :
          - backend          
        ports:
          #- 5000:5000 ## HTTP (for development purpose) (To see HTTP Packet) (RESTful API)
          - 5001:5001 # HTTPS
        environment :
          - DBHOST=mariadb
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_URLS=https://+:5001;http://+:5000
          - ASPNETCORE_Kestrel__Certificates__Default__Password=Passw0rd # must be equal to .pfx file's' password
          - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/testhttps.pfx
        volumes:
          - ./Maroik.WebAPI/:/https:ro
        depends_on :
          - mariadb  