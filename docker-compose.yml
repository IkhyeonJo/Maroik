##AWS step
#step 1: Create AWS instance (in my case, AWS Linux)
#step 2: Open PORT
#80, 443, 5000, 5001 (DevelopmentMode)
#80, 443, 5001 (Deploy)
#step 3: Copy the entire [Maroik] folder to your AWS Instance.

#Move to [Maroik] folder (which exists docker-compose.yml file) and execute below this command

#AWS Command
#-----------------------------------------------------------------------------------
#sudo yum update -y && sudo amazon-linux-extras install docker -y && sudo service docker start && sudo curl -L https://github.com/docker/compose/releases/download/1.21.0/docker-compose-`uname -s`-`uname -m` | sudo tee /usr/local/bin/docker-compose > /dev/null && sudo chmod +x /usr/local/bin/docker-compose && sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose && sudo docker-compose up -d && sudo yum install -y python3 && sudo yum install -y cronie && chmod 755 DBBackup.sh  && sudo chmod 755 UploadFileBackUp.sh && crontab InitCron && sudo service crond restart
#-----------------------------------------------------------------------------------

#Ubuntu Command
#-----------------------------------------------------------------------------------
#sudo apt update -y && sudo apt upgrade -y && sudo apt install docker-compose -y && sudo docker-compose up -d && sudo apt install python3 -y && sudo chmod 755 DBBackup.sh && sudo chmod 755 RebootDockerCompose.sh && sudo chmod 755 AutoMountExternalStorages.sh && sudo chmod 755 UploadFileBackUp.sh && sudo crontab InitCron && sudo service cron reload && ./AutoMountExternalStorages.sh
#-----------------------------------------------------------------------------------

###stop docker-compose
#sudo docker-compose down

## To delete all containers
#sudo docker rm -f $(docker ps -a -q)

## To delete all volumes
#sudo docker volume rm $(docker volume ls -q)

## To delete all the images,
#sudo docker rmi -f $(docker images -a -q)

## To delete all containers including its volumes use,
#sudo docker rm -vf $(docker ps -a -q)

## To clear crontab list
#sudo crontab -r

###check docker containers
#docker ps

###check docker images
#docker images

###check docker volume
#docker volume ls

###check crontab (MUST CHECK root and ec2-user)
#crontab -l

###remove docker images
#docker rmi [Image ID]

#when you should go debugging mode , change DB location (appsettings.json, DatabaseConfig.cs) and install (mariadb 10.6.5) and use IIS Express debugging mode

