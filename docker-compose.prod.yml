volumes:
      datasource:
      dataprotection-keys:
      redis-data:

networks:
       backend:

services:
    redis:
      image: redis:7-alpine
      container_name: Maroik.Redis
      restart: unless-stopped
      expose:
        - "6379"
      volumes:
        - redis-data:/data
      networks:
        - backend
      command: redis-server --appendonly yes
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

    clamav:
      image: clamav/clamav:latest
      container_name: Maroik.Clamav
      expose:
        - "3310"
      networks:
        - backend

    postgresql:
      image: postgres:17
      container_name: Maroik.PostgreSQL
      env_file:
        - .env.prod
      volumes:
        - datasource:/var/lib/postgresql/data
        - ./Maroik.DB/PostgreSQL/SQL_Init_Script/Production:/docker-entrypoint-initdb.d
      expose:
        - "5432"
      networks:
        - backend

    maroik.website:
        build :
         context : .
         dockerfile : Maroik.WebSite/Dockerfile
        container_name: Maroik.WebSite
        networks :
          - backend          
        ports:
          - "80:80"
          - "443:443"
        env_file:
          - .env.prod
        volumes:
          - ./Maroik.SSL/conf:/etc/letsencrypt:ro
          - ./Maroik.Log/:/app/Maroik.Log:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys
        depends_on:
          postgresql:
            condition: service_started
          redis:
            condition: service_healthy
          
    maroik.filestorage:
        build :
         context : .
         dockerfile : Maroik.FileStorage/Dockerfile
        container_name: Maroik.FileStorage
        networks :
          - backend
        expose:
          - "80"
        env_file:
          - .env.prod
        environment:
          - ASPNETCORE_URLS=http://+:80
        volumes:
          - ./Maroik.FileStorage/upload/:/app/upload:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys

    certbot:
        image: certbot/dns-cloudflare
        container_name: certbot
        volumes:
          - ./Maroik.SSL/conf:/etc/letsencrypt
          - ./Maroik.SSL/logs:/var/log/letsencrypt
          - ./Maroik.SSL/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
