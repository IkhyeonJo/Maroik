volumes:
      datasource:
      dataprotection-keys:
      valkey-data:
      rabbitmq-data:

networks:
       backend:

services:
    valkey:
      image: valkey/valkey:9-alpine
      container_name: Maroik.Valkey
      restart: unless-stopped
      expose:
        - "6379"
      volumes:
        - valkey-data:/data
      networks:
        - backend
      command: valkey-server --appendonly yes
      healthcheck:
        test: ["CMD", "valkey-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

    rabbitmq:
      image: rabbitmq:4-management-alpine
      container_name: Maroik.RabbitMQ
      restart: unless-stopped
      expose:
        - "5672"
        - "15672"
      env_file:
        - .env.prod
      volumes:
        - rabbitmq-data:/var/lib/rabbitmq
      networks:
        - backend
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

    clamav:
      image: clamav/clamav:latest
      container_name: Maroik.Clamav
      expose:
        - "3310"
      networks:
        - backend

    postgresql:
      image: postgres:17
      container_name: Maroik.PostgreSQL
      env_file:
        - .env.prod
      volumes:
        - datasource:/var/lib/postgresql/data
        - ./Maroik.DB/PostgreSQL/SQL_Init_Script/Production:/docker-entrypoint-initdb.d
      expose:
        - "5432"
      networks:
        - backend

    maroik.website:
        build :
         context : .
         dockerfile : Maroik.Website/Dockerfile
        container_name: Maroik.Website
        networks :
          - backend          
        ports:
          - "80:80"
          - "443:443"
        env_file:
          - .env.prod
        volumes:
          - ./Maroik.SSL/conf:/etc/letsencrypt:ro
          - ./Maroik.Log/:/app/Maroik.Log:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys
        depends_on:
          postgresql:
            condition: service_started
          valkey:
            condition: service_healthy
          rabbitmq:
            condition: service_healthy

    maroik.filestorage:
        build :
         context : .
         dockerfile : Maroik.FileStorage/Dockerfile
        container_name: Maroik.FileStorage
        networks :
          - backend
        expose:
          - "80"
        env_file:
          - .env.prod
        environment:
          - ASPNETCORE_URLS=http://+:80
        volumes:
          - ./Maroik.FileStorage/upload/:/app/upload:rw
          - dataprotection-keys:/root/.aspnet/DataProtection-Keys

    maroik.worker:
        build :
         context : .
         dockerfile : Maroik.Worker/Dockerfile
        container_name: Maroik.Worker
        networks :
          - backend
        env_file:
          - .env.prod
        volumes:
          - ./Maroik.Log/:/app/Maroik.Log:rw
        depends_on:
          postgresql:
            condition: service_started
          rabbitmq:
            condition: service_healthy

    certbot:
        image: certbot/dns-cloudflare
        container_name: certbot
        volumes:
          - ./Maroik.SSL/conf:/etc/letsencrypt
          - ./Maroik.SSL/logs:/var/log/letsencrypt
          - ./Maroik.SSL/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
