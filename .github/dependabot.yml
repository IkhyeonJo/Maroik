# Monthly pull requests for the NuGet packages, the client-script toolchain and the GitHub Actions. Minor and patch updates of
# one ecosystem come together in one pull request, a major update on its own. Merging one to main deploys it, so nothing merges
# by itself.
#
# Left out on purpose:
# - Docker images: the SDK tags move with global.json in one pull request (sdk-bump.yml, which says why Dependabot cannot),
#   the runtime images float on 10.0, and a compose image's new version is a deliberate edit.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to what the SDK's compiler can load (Directory.Packages.props says how to check), so they move with the SDK.
      - dependency-name: Microsoft.CodeAnalysis.BannedApiAnalyzers
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: StyleCop.Analyzers
      # A new major of these follows a new .NET: moving to it is one deliberate change with the target framework and the SDK.
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
        update-types: [version-update:semver-major]
      - dependency-name: Serilog.AspNetCore
        update-types: [version-update:semver-major]
      - dependency-name: Serilog.Extensions.Hosting
        update-types: [version-update:semver-major]
      - dependency-name: System.Security.Cryptography.*
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /Maroik.Website
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # These describe the vendored client libraries in wwwroot, so they follow those versions, not the newest release.
      - dependency-name: "@fullcalendar/core"
      - dependency-name: "@types/chart.js"
      - dependency-name: "@types/jquery"
      - dependency-name: "@types/jquery.validation"
      - dependency-name: "@types/jqueryui"
      - dependency-name: "@types/summernote"
      - dependency-name: "@types/toastr"
      - dependency-name: jquery
      - dependency-name: moment

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
