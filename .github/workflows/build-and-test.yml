name: Build & Test (reusable)

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Maroik.sln

      - name: Build
        run: dotnet build Maroik.sln --no-restore --configuration Release

      # ── Unit & Integration Tests ─────────────────────────────────────────────
      - name: Unit & Integration Tests
        run: |
          dotnet test Maroik.sln \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName!~E2E" \
            --logger "github;annotations.format=json" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      # ── E2E Tests (Playwright) ───────────────────────────────────────────────
      - name: Install Playwright browsers
        run: pwsh Maroik.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E Tests
        run: |
          dotnet test Maroik.E2E.Tests/Maroik.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "github;annotations.format=json"
