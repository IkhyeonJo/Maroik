name: Build & Test (reusable)

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Maroik.sln

      - name: Build
        run: dotnet build Maroik.sln --no-restore --configuration Release

      # ── Unit & Integration Tests ─────────────────────────────────────────────
      - name: Unit & Integration Tests
        run: |
          dotnet test Maroik.sln \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName!~E2E" \
            --logger "github;annotations.format=json" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      # ── Coverage Threshold ───────────────────────────────────────────────────
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Check Coverage Threshold (60%)
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"TextSummary;Html" \
            -assemblyfilters:"-*Tests*;-*E2E*"
          cat ./coverage/report/Summary.txt
          python3 -c "
          import re, sys
          with open('./coverage/report/Summary.txt') as f:
              content = f.read()
          m = re.search(r'Line coverage:\s+([\d.]+)%', content)
          if not m:
              print('ERROR: Could not parse line coverage', file=sys.stderr)
              sys.exit(1)
          cov = float(m.group(1))
          threshold = 60.0
          print(f'Line coverage: {cov}%')
          if cov < threshold:
              print(f'::error::Coverage {cov}% is below the {threshold}% minimum threshold', file=sys.stderr)
              sys.exit(1)
          print(f'Coverage check passed: {cov}% >= {threshold}%')
          "

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/report
          retention-days: 30

      # ── E2E Tests (Playwright) ───────────────────────────────────────────────
      - name: Install Playwright browsers
        run: pwsh Maroik.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E Tests
        run: |
          dotnet test Maroik.E2E.Tests/Maroik.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "github;annotations.format=json"
