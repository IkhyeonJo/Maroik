#----------------------------------------------------------------------------------------------------
#Backup and restore a mysql database from a running Docker mysql container

## Backup
#docker exec CONTAINER /usr/bin/mysqldump -u root --password=root DATABASE > backup.sql

## Restore
#cat backup.sql | docker exec -i CONTAINER /usr/bin/mysql -u root --password=root DATABASE
#----------------------------------------------------------------------------------------------------


#For Publish
version: "3"

volumes:
      datasource:

networks:       
       backend:

services:

      mysql:
        image: "mariadb:10.2.38" # Modify DatabaseConfig.cs too
        volumes:
          - datasource:/var/lib/mysql
          - ./_MariaDBSql_Init_Script:/docker-entrypoint-initdb.d # just insert sql scripts into container directory (docker-entrypoint-initdb.d)
        networks:
          - backend
        environment:
          - MYSQL_ROOT_PASSWORD=root
          - bind-address=0.0.0.0
          - TZ=Asia/Seoul
        command:
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
      
      mvc:
        build :
         context : .
         dockerfile : Dockerfile
        networks :
         - backend          
        ports:
         - 5000:80
        environment :
         - DBHOST=mysql
         - ASPNETCORE_ENVIRONMENT=Development
        depends_on :
         - mysql  
          